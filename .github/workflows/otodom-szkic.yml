# Jednorazowy import ogłoszenia z Otodom jako szkic oferty w CRM (uruchamia się przy pushu tej gałęzi).
name: Otodom szkic
on:
  push:
    branches: [claude/project-thread-3a1x9k]
    paths: [scripts/otodom/**, .github/workflows/otodom-szkic.yml]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Dodaj szkic oferty
        run: node scripts/otodom/insert.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      - name: Zapisz zdjęcie w gałęzi
        run: |
          [ -f zdjecie.webp ] || exit 0
          mkdir -p scripts/otodom/out && mv zdjecie.webp scripts/otodom/out/
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -f scripts/otodom/out && git commit -m "Otodom: zdjęcie do szkicu [skip ci]" && git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zdjecie
          path: zdjecie.webp
          if-no-files-found: ignore
