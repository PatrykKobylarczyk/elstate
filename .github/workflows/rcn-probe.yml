name: RCN probe
on:
  push:
    branches: [claude/project-thread-3riew7]
    paths: [.github/workflows/rcn-probe.yml, scripts/rcn-probe.py]
concurrency: { group: rcn-probe, cancel-in-progress: true }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download
        timeout-minutes: 15
        run: |
          for t in 1003 1061; do
            curl -sSL --retry 2 -m 800 -o $t.zip -w "$t: %{http_code} %{size_download} B in %{time_total}s\n" https://opendata.geoportal.gov.pl/InneDane/latest_exports/rcn_transakcje_ceny/GPKG/${t}_transakcje_ceny.gpkg.zip || echo "fail $t"
            unzip -o -q $t.zip -d $t && ls -la $t || head -c 300 $t.zip
          done
      - name: Schema
        timeout-minutes: 5
        run: python3 -I scripts/rcn-probe.py 1003 1061
